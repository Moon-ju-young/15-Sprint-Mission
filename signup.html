<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/login-signup.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
</head>
<body>
    <main>
        <a class="logo" href="/">
            <img class="logo" src="images/Img_logo.png" alt="판다마켓">
        </a>
        <form>
            <label for="email">이메일</label>
            <input id="email" name="email" type="email">
            <label for="nickname">닉네임</label>
            <input id="nickname" name="nickname">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password">
            <label for="password-check">비밀번호 확인</label>
            <input id="password-check" name="password-check" type="password">
            <button>회원가입</button>
        </form>
        <div class="simple-login">
            간편 로그인하기
            <div>
                <a href="https://www.google.com/"><img src="images/ic_button_google.svg"></a>
                <a href="https://www.kakaotalk.com"><img src="images/ic_button_kakaotalk.svg"></a>
            </div>
        </div>
        <div class="bottom-text">
            이미 회원이신가요? <a href="/login.html">로그인</a>
        </div>
    </main>
</body>
</html>
